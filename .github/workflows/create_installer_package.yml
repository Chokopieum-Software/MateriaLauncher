name: Windows installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      BUILD_SOURCE: GitHub Actions
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1

      # Use the same SDK as local builds; the major-version resolver selected an older JBR.
      - name: Download pinned JBR SDK
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'jbrsdk.tar.gz'
          Invoke-WebRequest 'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.4.1-windows-x64-b635.79.tar.gz' -OutFile $archive
          $expected = 'b7f75b8fc36286224803a67e1eea082f77c4eb8e67db8688131de45da0cd4b0bd1ae642975e1b92dbbb97a0d879f59e62b53deaca083ec0836a4de6091a8efb8'
          if ((Get-FileHash $archive -Algorithm SHA512).Hash -ne $expected) { throw 'JBR SDK checksum mismatch' }

      - name: Set up pinned JBR SDK
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'jbrsdk'
          New-Item -ItemType Directory -Path $sdkRoot -Force | Out-Null
          tar -xzf "$env:RUNNER_TEMP/jbrsdk.tar.gz" -C $sdkRoot
          if ($LASTEXITCODE -ne 0) { throw 'JBR SDK extraction failed' }
          $jdk = Get-ChildItem $sdkRoot -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'bin/javac.exe') } | Select-Object -First 1
          if (!$jdk) { throw 'Full JBR SDK not found' }
          "JAVA_HOME=$($jdk.FullName)" >> $env:GITHUB_ENV
          (Join-Path $jdk.FullName 'bin') >> $env:GITHUB_PATH
          & (Join-Path $jdk.FullName 'bin/java.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'JBR SDK cannot start' }
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Inno Setup 7.1.1
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $expected = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Inno Setup checksum mismatch' }
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDir`"" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          $iscc = Join-Path $installDir 'ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 7 compiler missing' }
          $version = (& $iscc --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '\b7\.1\.1\b') { throw "Unexpected Inno Setup version: $version" }
          Write-Host "Using Inno Setup $version at $iscc"
          "INNO_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Test and build application directory
        run: |
          ./gradlew.bat --no-daemon test :core:test :ui-components:test :updater:mingwX64Test createDistributable
          if ($LASTEXITCODE -ne 0) { throw 'Tests or application build failed' }

      # Keep the name stable: installer-online.iss resolves it through nightly.link.
      # Upload the directory contents directly, without an extra ZIP or parent folder.
      - name: Upload online installer payload
        if: github.ref == 'refs/heads/sunrise-dev'
        uses: actions/upload-artifact@v4
        with:
          name: materia-launcher-app-windows-x64
          path: build/compose/binaries/main/app/materia-launcher/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Inno Setup installer
        run: |
          $iscc = $env:INNO_ISCC
          if (!$iscc -or !(Test-Path $iscc)) { throw 'Pinned Inno Setup 7 compiler not found' }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          if (!(Test-Path 'build/inno-setup/MateriaLauncher-Setup.exe')) { throw 'Installer missing' }
          if ($env:GITHUB_REF -eq 'refs/heads/sunrise-dev') {
            & $iscc installer-online.iss
            if ($LASTEXITCODE -ne 0) { throw 'Online installer compilation failed (Inno Setup 7+ required)' }
            if (!(Test-Path 'build/inno-setup/MateriaLauncher-Online-Setup.exe')) { throw 'Online installer missing' }
          }
          git diff --exit-code -- build.properties
          if ($LASTEXITCODE -ne 0) { throw 'Build modified build.properties' }
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: materia-launcher-windows-x64-${{ github.run_number }}
          path: |
            build/inno-setup/*.exe
          if-no-files-found: error
          retention-days: 30
